    modelzoo_run: "Run endpoint task"
    modelzoo_run_desc: "Submit a task to a Model Zoo endpoint and poll for results"
    login_desc: |-
      Log in to BizyAir using an API key.

      Examples:
         bizyair login
         bizyair login -k $SF_API_KEY
    upload_desc: |-
      Upload model files to BizyAir. Supports single-file and YAML batch upload.

      Examples:
         bizyair upload -n mymodel -t LoRA -p model.safetensors -b "FLUX.1 D" --cover cover.jpg --intro "desc"
         bizyair upload -f config.yaml
    model_list_desc: |-
      List your models on BizyAir.

      Examples:
         bizyair model ls
         bizyair model ls -t LoRA --sort "Most Downloaded"
         bizyair model ls --keyword test --base-model "FLUX.1 D"
         bizyair model ls --open
    model_remove_desc: |-
      Remove your model. Supports ID or name.

      Examples:
         bizyair model rm 56391 -y
         bizyair model rm -n test_5 -t Checkpoint -y
    model_detail_desc: |-
      Show model detail by ID or name.

      Examples:
         bizyair model detail 56391
         bizyair model detail test_5 -t Checkpoint
    model_public_desc: |-
      Toggle public status of all model versions. Auto-toggles when --public is not specified.

      Examples:
         bizyair model public 56391 -y                        # Auto-toggle
         bizyair model public 56391 --public true -y           # Force public
         bizyair model public -n test_5 -t LoRA -y             # By name
    upgrade_desc: |-
      Check for and install CLI updates.

      Examples:
         bizyair upgrade --check
         bizyair upgrade
