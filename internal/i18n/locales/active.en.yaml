app:
  summary: "A CLI tool for BizyAir."
  quick_start: |-
    BizyAir CLI manages model files on BizyAir, with both an interactive TUI and command-line modes.

    Quick start:
       bizyair                           # Launch interactive TUI
       bizyair login                     # Authenticate with API key
       bizyair upload -n mymodel ...     # Upload a model
       bizyair model ls                  # List your models
  language: "Language for this run (en or zh-CN)."
  version_format: |-
    Version: {{.Version}}
    Revision: {{.Revision}}
    Built At: {{.BuildDate}}

