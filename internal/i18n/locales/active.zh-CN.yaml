app:
  summary: "BizyAir 命令行工具。"
  quick_start: |-
    BizyAir CLI 管理你在 BizyAir 上的模型文件，提供交互式 TUI 和命令行两种模式。

    快速开始:
       bizyair                           # 启动交互式 TUI
       bizyair login                     # 使用 API Key 登录
       bizyair upload -n mymodel ...     # 上传模型
       bizyair model ls                  # 列出你的模型
  language: "本次运行使用的语言（en 或 zh-CN）。"
  version_format: |-
    版本：{{.Version}}
    修订：{{.Revision}}
    构建时间：{{.BuildDate}}

